; PlatformIO wrapper for the ESP-IDF project in this repository.
;
; Upstream builds with a standalone ESP-IDF v5.4.2 install via idf.py.
; This wrapper builds the same sources through the pioarduino espressif32
; platform instead, which brings its own IDF tree, toolchain and Python
; environment, so no separate IDF installation is needed.
;
; The platform release is pinned to the 54.x line, which ships ESP-IDF
; v5.4.2. The current 55.x line ships 5.5.x, where esp_now_register_send_cb
; changed signature and the espressif/esp-now managed component pulled in by
; main/idf_component.yml no longer compiles.
;
; Project layout maps onto PlatformIO's ESP-IDF support directly:
;   main/         -> main component (src_dir)
;   components/   -> extra components fetched by fetch_repos.py
;   sdkconfig.defaults, partitions.csv -> picked up as-is
;
; The root CMakeLists.txt is only used by idf.py and is ignored here.

[platformio]
src_dir = main
default_envs = cores3_adv

[env:cores3_adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework = espidf
board = m5stack-cores3
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
